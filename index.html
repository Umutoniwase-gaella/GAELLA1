<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Management System</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <h1>Student Management System</h1>

</header>


<main>


    <section class="registration">

        <h2>Student Registration</h2>


        <form id="studentForm">


            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                name="studentId"
                required
            >


            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                name="fullName"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="gender">
                Gender
            </label>

            <select
                id="gender"
                name="gender"
                required
            >

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

            </select>


            <label for="course">
                Course
            </label>

            <select
                id="course"
                name="course"
                required
            >

                <option value="">
                    Select Course
                </option>

                <option value="Software Development">
                    Software Development
                </option>

                <option value="Networking">
                    Networking
                </option>

                <option value="Database Development">
                    Database Development
                </option>

            </select>


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                required
            >


            <button type="submit">
                Register Student
            </button>


        </form>


        <p
            id="message"
            style="font-weight: bold; margin-top: 15px;"
        ></p>


    </section>



    <section class="student-list">


        <h2>Registered Students</h2>


        <input
            type="text"
            id="searchInput"
            placeholder="Search students..."
        >


        <button
            type="button"
            id="searchButton"
        >
            Search
        </button>


        <table>


            <thead>

                <tr>

                    <th>Student ID</th>

                    <th>Full Name</th>

                    <th>Email</th>

                    <th>Gender</th>

                    <th>Course</th>

                    <th>Phone</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="studentTableBody">

            </tbody>


        </table>


    </section>


</main>


<script src="script.js"></script>


</body>

</html>
